  <circle cx="67" cy="59" r="6.5" fill="#C9A227"/>
  <circle cx="134" cy="58" r="13" fill="#0D0D0D"/>
  <circle cx="133" cy="59" r="6.5" fill="#C9A227"/>

  <!-- Cabeça -->
  <circle cx="100" cy="96" r="50" fill="#0D0D0D"/>

  <!-- Focinho (patch mais claro e suave) -->
