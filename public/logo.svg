    <g transform="translate(122.5,140.4) rotate(-28)">
      <path d="M0,0 L0,18"/>
      <path d="M-8,18 L8,18"/>
      <path d="M-8,18 L-8,32"/>
      <path d="M0,18 L0,32"/>
      <path d="M8,18 L8,32"/>
    </g>
    <g transform="translate(77.5,140.4) rotate(28)">
      <path d="M0,0 L0,18"/>
      <ellipse cx="0" cy="30" rx="8.5" ry="11.5"/>
    </g>
  </g>

  <!-- Orelhas em formato de folha -->
  <g fill="none" stroke="#C9A227" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M66,60 Q56,40 66,28 Q78,42 74,60 Z"/>
    <path d="M134,60 Q144,40 134,28 Q122,42 126,60 Z"/>
