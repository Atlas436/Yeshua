    <path d="M146.8,85.3 Q164.9,72.6 179.9,77.8 Q168.6,89.0 146.8,85.3 Z"/>
    <path d="M146.8,106.7 Q173.6,103.6 189.7,116.5 Q169.6,121.1 146.8,106.7 Z"/>
    <path d="M53.2,106.7 Q30.4,121.1 10.3,116.5 Q26.4,103.6 53.2,106.7 Z"/>
