  <circle cx="117.5" cy="95" r="2.6" fill="#C9A227"/>

  <!-- Focinho minimalista -->
  <path d="M100,105 L107,112 L100,118 L93,112 Z" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M100,118 L100,123" stroke="#C9A227" stroke-width="2.4" fill="none" stroke-linecap="round"/>
