  <path d="M71,85 Q82,78 92,84" fill="none" stroke="#C9A227" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M129,85 Q118,78 108,84" fill="none" stroke="#C9A227" stroke-width="2.6" stroke-linecap="round"/>

