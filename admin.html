<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel administrativo | Yeshua Marmitas Fit</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
</head>
<body>

  <div id="page-loader" aria-hidden="true"></div>

  <!-- ===== Login ===== -->
  <section id="admin-login" class="bg-preto" style="min-height: 100vh; display: flex; align-items: center;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="text-center mb-4">
            <img src="/logo-icon.svg" alt="Yeshua" width="72" height="72" style="border-radius: 22%; box-shadow: 0 0.5rem 1.5rem rgba(40,14,4,0.25);" />
            <h1 class="fonte-titulo mt-3 mb-0" style="font-size: 1.7rem;">Painel <span class="text-dourado">administrativo</span></h1>
            <p class="small mb-0" style="color: rgba(40,14,4,0.6);">Yeshua Marmitas Fit</p>
          </div>
          <form id="form-login" class="form-yeshua card-yeshua p-4 p-md-5" novalidate>
            <div id="login-erro" class="alert alert-danger d-none" role="alert"></div>
            <div class="mb-3">
              <label for="login-email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="login-email" required />
            </div>
            <div class="mb-4">
              <label for="login-senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="login-senha" required />
            </div>
            <button type="submit" class="btn btn-dourado w-100">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Painel ===== -->
  <section id="admin-painel" class="bg-preto d-none" style="min-height: 100vh;">
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex align-items-center gap-2">
          <img src="/logo-icon.svg" alt="Yeshua" width="42" height="42" class="logo-nav" />
          <h1 class="fonte-titulo mb-0" style="font-size: 1.5rem;">Pedidos</h1>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button type="button" id="btn-atualizar" class="btn btn-outline-dourado btn-sm">Atualizar</button>
          <button type="button" id="btn-logout" class="btn btn-terracota btn-sm">Sair</button>
        </div>
      </div>
      <div id="pedidos-vazio" class="card-yeshua p-5 text-center d-none">
        <p class="mb-0">Nenhum pedido ainda.</p>
      </div>
      <div id="pedidos-lista" class="d-flex flex-column gap-3"></div>
    </div>
  </section>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
